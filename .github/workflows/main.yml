name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate terminal metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: robertsima

          template: terminal
          filename: metrics.terminal.svg
          base: header, metadata
          
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_habits: yes
          
          commits_authoring: Robert Sima, robertsima, robertsima@users.noreply.github.com
          
      - name: Generate LeetCode metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: robertsima

          template: classic
          filename: metrics.plugin.leetcode.svg
          base: " "

          plugin_leetcode: yes
          plugin_leetcode_user: robertsima
          plugin_leetcode_sections: solved, skills, recent

      - name: Generate GitHub City
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: robertsima

          template: classic
          filename: metrics.plugin.skyline.svg
          base: " "

          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugin_skyline_frames: 6
          plugin_skyline_quality: 0.5

          plugin_skyline_settings: |
            {
              "url": "https://honzaap.github.io/GithubCity?name=${login}&year=${year}",
              "ready": "[...document.querySelectorAll('.display-info span')].map(span => span.innerText).includes('${login}')",
              "wait": 4,
              "hide": ".github-corner, .footer-link, .buttons-options, .mobile-rotate, .display-info span:first-child"
            }
